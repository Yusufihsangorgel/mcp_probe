<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 434"
     font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#111827">
  A server that stops answering, asked for its tool list four times
</text>
<text x="24" y="58" font-size="13" fill="#6b7280">
  Same fixture and same request in every row. The only thing that changes is
  the timeout given to the harness, and that is where the failure lands.
</text>
<line x1="168.0" y1="84.0" x2="168.0" y2="348.0" stroke="#eceff3" stroke-width="1"/>
<text x="168.0" y="366.0" text-anchor="middle" font-size="12" fill="#6b7280">0 s</text>
<line x1="275.4" y1="84.0" x2="275.4" y2="348.0" stroke="#eceff3" stroke-width="1"/>
<text x="275.4" y="366.0" text-anchor="middle" font-size="12" fill="#6b7280">1 s</text>
<line x1="382.8" y1="84.0" x2="382.8" y2="348.0" stroke="#eceff3" stroke-width="1"/>
<text x="382.8" y="366.0" text-anchor="middle" font-size="12" fill="#6b7280">2 s</text>
<line x1="490.2" y1="84.0" x2="490.2" y2="348.0" stroke="#eceff3" stroke-width="1"/>
<text x="490.2" y="366.0" text-anchor="middle" font-size="12" fill="#6b7280">3 s</text>
<line x1="597.5" y1="84.0" x2="597.5" y2="348.0" stroke="#eceff3" stroke-width="1"/>
<text x="597.5" y="366.0" text-anchor="middle" font-size="12" fill="#6b7280">4 s</text>
<line x1="704.9" y1="84.0" x2="704.9" y2="348.0" stroke="#eceff3" stroke-width="1"/>
<text x="704.9" y="366.0" text-anchor="middle" font-size="12" fill="#6b7280">5 s</text>
<line x1="812.3" y1="84.0" x2="812.3" y2="348.0" stroke="#eceff3" stroke-width="1"/>
<text x="812.3" y="366.0" text-anchor="middle" font-size="12" fill="#6b7280">6 s</text>

<text x="24" y="114.0" font-size="14" font-weight="600" font-family="monospace" fill="#111827">no harness</text>
<text x="24" y="131.0" font-size="11.5" fill="#6b7280">hand-written stdio client</text>
<rect x="168.0" y="102.0" width="630.6" height="24.0" rx="5" fill="#fee2e2" stroke="#f87171"/>
<path d="M 798.6 102.0 L 812.6 114.0 L 798.6 126.0 Z" fill="#f87171"/>
<text x="180.0" y="118.5" font-size="12.5" fill="#991b1b">no reply at 6.0 s, when this tool stopped watching; the process was still running</text>
<text x="24" y="176.0" font-size="14" font-weight="600" font-family="monospace" fill="#111827">timeout: 500 ms</text>
<text x="24" y="193.0" font-size="11.5" fill="#6b7280">McpServerHarness.start</text>
<rect x="168.0" y="164.0" width="54.1" height="24.0" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
<line x1="222.1" y1="158.0" x2="222.1" y2="194.0" stroke="#b45309" stroke-width="2"/>
<text x="234.1" y="175.0" font-size="12.5" font-weight="600" fill="#b45309">TimeoutException after 504 ms</text>
<circle cx="240.1" cy="186.0" r="4" fill="#047857"/>
<text x="250.1" y="190.0" font-size="12" fill="#047857">process gone 12 ms later, exit 0</text>
<text x="24" y="238.0" font-size="14" font-weight="600" font-family="monospace" fill="#111827">timeout: 1 s</text>
<text x="24" y="255.0" font-size="11.5" fill="#6b7280">McpServerHarness.start</text>
<rect x="168.0" y="226.0" width="107.7" height="24.0" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
<line x1="275.7" y1="220.0" x2="275.7" y2="256.0" stroke="#b45309" stroke-width="2"/>
<text x="287.7" y="237.0" font-size="12.5" font-weight="600" fill="#b45309">TimeoutException after 1003 ms</text>
<circle cx="293.7" cy="248.0" r="4" fill="#047857"/>
<text x="303.7" y="252.0" font-size="12" fill="#047857">process gone 10 ms later, exit 0</text>
<text x="24" y="300.0" font-size="14" font-weight="600" font-family="monospace" fill="#111827">timeout: 2 s</text>
<text x="24" y="317.0" font-size="11.5" fill="#6b7280">McpServerHarness.start</text>
<rect x="168.0" y="288.0" width="215.0" height="24.0" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
<line x1="383.0" y1="282.0" x2="383.0" y2="318.0" stroke="#b45309" stroke-width="2"/>
<text x="395.0" y="299.0" font-size="12.5" font-weight="600" fill="#b45309">TimeoutException after 2002 ms</text>
<circle cx="401.0" cy="310.0" r="4" fill="#047857"/>
<text x="411.0" y="314.0" font-size="12" fill="#047857">process gone 9 ms later, exit 0</text>

<line x1="168.0" y1="348.0" x2="866.0" y2="348.0"
      stroke="#9ca3af" stroke-width="1"/>
<text x="517.0" y="388.0"
      text-anchor="middle" font-size="12" fill="#6b7280">
  wall clock from the moment tools/list went out
</text>
<text x="24" y="414.0" font-size="11.5" fill="#9ca3af">
  every row drives
  <tspan font-family="monospace">unresponsive_methods_server</tspan>, a fixture
  that answers the handshake in 53 ms and then replies to
  nothing
</text>
</svg>
