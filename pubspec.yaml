name: mcp_probe
description: >-
  Conformance checks and a test harness for Model Context Protocol (MCP)
  servers. Runs any MCP server over stdio and asserts on its behavior from
  package:test. Built on dart_mcp.
version: 0.9.5
executables:
  mcp_probe:
repository: https://github.com/Yusufihsangorgel/mcp_probe
topics:
  - mcp
  - testing
  - ai
  - server
  - conformance

screenshots:
  - description: |-
      The harness starts your MCP server as a subprocess, drives it over stdio with JSON-RPC, and turns each rule's reply into one finding in a ConformanceReport.
    path: doc/architecture.png

# The harness starts the MCP server under test with Process.start, so it runs
# only where a Dart process may spawn a child. iOS forbids that outright
# ("Starting new processes is not supported on iOS"), and web has no dart:io,
# so neither is listed. Without this block pub.dev infers every platform and
# advertises an iOS support that cannot work.
platforms:
  android:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.8.0

dependencies:
  dart_mcp: ^0.5.2
  matcher: ^0.12.16
  json_rpc_2: ">=3.0.3 <5.0.0"

dev_dependencies:
  test: ^1.25.6
  lints: ^6.0.0
